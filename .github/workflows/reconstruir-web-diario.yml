# Regenera la web cada día para que los artículos con fecha futura
# (y "Publicado" activado) aparezcan solos el día que les toca.
# También se puede lanzar a mano: pestaña Actions > "Reconstruir web cada día" > Run workflow.
name: Reconstruir web cada día

on:
  schedule:
    # Los artículos se programan a las 8:00 (hora de España). GitHub usa hora UTC y suele retrasar
    # estas tareas 6 horas o más. Las de madrugada arrancan de noche y, si hay artículo ese día,
    # esperan hasta las 8:05. Las demás son respaldo por si GitHub se retrasa aún más:
    - cron: "10 0 * * *"
    - cron: "10 3 * * *"
    - cron: "15 6 * * *"
    - cron: "15 7 * * *"
    - cron: "30 10 * * *"
  workflow_dispatch:

permissions:
  pages: write
  contents: write

jobs:
  # GitHub corta cada trabajo a las 6 horas, por eso la espera va en dos tramos
  esperar-1:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      objetivo: ${{ steps.hora.outputs.objetivo }}
    steps:
      - uses: actions/checkout@v4
      - name: Esperar a las 8:05 si hoy sale un artículo
        id: hora
        run: |
          hoy=$(TZ=Europe/Madrid date +%F)
          objetivo=0
          if [ "${{ github.event_name }}" = "schedule" ] \
            && grep -lE "^date: *['\"]?$hoy" _posts/*.md | xargs -r grep -lE "^published: *true" | grep -q .; then
            objetivo=$(TZ=Europe/Madrid date -d "$hoy 08:05" +%s)
          fi
          echo "objetivo=$objetivo" >> "$GITHUB_OUTPUT"
          resto=$(( objetivo - $(date +%s) ))
          [ "$resto" -gt 20400 ] && resto=20400
          [ "$resto" -gt 0 ] && sleep "$resto"
          exit 0

  esperar-2:
    needs: esperar-1
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Esperar lo que quede
        run: |
          resto=$(( ${{ needs.esperar-1.outputs.objetivo }} - $(date +%s) ))
          [ "$resto" -gt 0 ] && sleep "$resto"
          exit 0

  rebuild:
    needs: esperar-2
    runs-on: ubuntu-latest
    steps:
      - name: Pedir a GitHub Pages que regenere la web
        id: api
        continue-on-error: true
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"

      # Plan B: si la petición anterior falla, un commit vacío también fuerza la reconstrucción
      - name: Commit vacío de respaldo
        if: steps.api.outcome == 'failure'
        uses: actions/checkout@v4
      - if: steps.api.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Reconstrucción diaria de la web"
          git push
