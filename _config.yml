title: "Idoia Chair - PNI y Salud Integrativa"
url: "https://idoiachairpni.es"
lang: es
theme: null

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-sitemap

permalink: /blog/:slug/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - Gemfile
  - Gemfile.lock
  - README-mobile-menu-fix.md
  - vendor
  - node_modules
